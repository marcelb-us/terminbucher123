name: Termin-Check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test_notify:
        description: 'Nur Telegram-Testnachricht senden (1 = ja)'
        default: '0'
      url:
        description: 'Optional: andere eTermin-Seite zum Testen'
        default: ''

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Termin prüfen
        run: node check.js
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUTOFF: '2099-12-31'
          TEST_NOTIFY: ${{ github.event.inputs.test_notify }}
          URL_OVERRIDE: ${{ github.event.inputs.url }}

      - name: Diagnose-Dateien speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 3
